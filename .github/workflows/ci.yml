name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Show collected unit tests
        run: pytest --collect-only -q -m "not integration" tests/

      - name: Run unit tests
        run: pytest -v -m "not integration" tests/ --junit-xml=pytest-report.xml

      - name: Guard against false-green (no tests / all skipped)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pytest-report.xml').getroot()
          ts = root.find('testsuite') if root.tag == 'testsuites' else root
          tests = int(ts.get('tests', '0'))
          skipped = int(ts.get('skipped', '0'))
          errors = int(ts.get('errors', '0'))
          failures = int(ts.get('failures', '0'))
          print(f'tests={tests} skipped={skipped} errors={errors} failures={failures}')
          if tests == 0:
              raise SystemExit('CI false-green guard: no unit tests were collected.')
          if tests > 0 and skipped == tests:
              raise SystemExit('CI false-green guard: all unit tests were skipped.')
          PY

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: forge-api:ci
