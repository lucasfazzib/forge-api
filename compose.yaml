services:
  forge-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: forge-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - OLLAMA_URL=http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - forge-net

networks:
  forge-net:
    external: true
    name: forge-infra_forge-net